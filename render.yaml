services:
  - type: web
    name: nebula-echo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 300 --threads 4
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false      # 部署时手填
      - key: GITHUB_TOKEN
        sync: false      # 仅 usage.json 读写权限的 PAT
      - key: GITHUB_USAGE_REPO
        sync: false      # e.g. Liu233jh/nebula-echo
      - key: ECHO_LIMIT_YUAN
        value: "9.5"
      - key: PYTHON_VERSION
        value: 3.11.9
